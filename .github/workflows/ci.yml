name: "Continuous Integration"

on:
  pull_request:
  push:
  release:
    types: [ published ]
  workflow_dispatch:

# OIDC-related permissions for trusted publishing to NPMJS. The reusable workflow scopes id-token to the publish job, but GitHub requires the caller to grant the
# ceiling of permissions the reusable workflow can claim.
permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: hjdhjd/github-workflows/.github/workflows/nodejs-ci.yml@main
    secrets: inherit

  test:
    name: "Test (node:test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [ lts/-1, lts/* ]

    steps:
      - name: Checkout the repository.
        uses: actions/checkout@v6

      - name: Setup the node ${{ matrix.node-version }} environment.
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies and run tests.
        env:
          CI: true
        run: |
          npm ci
          npm test